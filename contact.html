<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YA Marketing Agency</title>
<meta name="description" content="YA Marketing Agency — وكالة تسويق رقمي: إدارة سوشيال ميديا، إعلانات ممولة، دعاية وتسويق إلكتروني. Stop Thinking | Start Doing.">
<meta name="theme-color" content="#0b1740">
<link rel="canonical" href="https://yamarketing-eg.com/contact">
<meta property="og:type" content="website">
<meta property="og:site_name" content="YA Marketing Agency">
<meta property="og:title" content="YA Marketing Agency | وكالة تسويق رقمي">
<meta property="og:description" content="YA Marketing Agency — وكالة تسويق رقمي: إدارة سوشيال ميديا، إعلانات ممولة، دعاية وتسويق إلكتروني. Stop Thinking | Start Doing.">
<meta property="og:url" content="https://yamarketing-eg.com/contact">
<meta property="og:image" content="https://yamarketing-eg.com/assets/img/og.png">
<meta property="og:locale" content="ar_AR">
<meta property="og:locale:alternate" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="/assets/js/theme.js"></script>
<script src="/assets/js/main.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="page-hero"><div class="container"><h1 data-i18n="con.title"></h1><p data-i18n="con.sub"></p></div></div>
<section><div class="container contact-grid">
 <div class="card"><h3 data-i18n="con.info"></h3>
  <div class="social">
   <a class="wa" data-wa target="_blank" rel="noopener" href="#">💬 <span data-i18n="con.wa"></span></a>
   <a data-link="instagram" target="_blank" rel="noopener" href="#">📸 Instagram</a>
   <a data-link="facebook" target="_blank" rel="noopener" href="#">👍 Facebook</a>
  </div></div>
 <div class="card quote-form"><h3 data-i18n="q.title"></h3><p class="q-sub" data-i18n="q.sub"></p>
<form id="quoteForm" name="quote" method="POST" data-netlify="true" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="quote">
  <p class="hp"><label>Leave this empty: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
  <label for="name" data-i18n="con.name"></label><input id="name" name="name" required>
  <label for="phone" data-i18n="con.phone"></label><input id="phone" name="phone" type="tel" required>
  <label for="business" data-i18n="q.biz"></label><input id="business" name="business" data-i18n-ph="q.biz_ph">
  <label for="service" data-i18n="con.service"></label><select id="service" name="service"><option value="s1t" data-i18n="s1t"></option><option value="s2t" data-i18n="s2t"></option><option value="s3t" data-i18n="s3t"></option><option value="s4t" data-i18n="s4t"></option><option value="s5t" data-i18n="s5t"></option><option value="s6t" data-i18n="s6t"></option><option value="q.other" data-i18n="q.other"></option></select>
  <label for="msg" data-i18n="q.msg"></label><textarea id="msg" name="msg"></textarea>
  <button class="btn btn-primary" type="submit" data-i18n="q.send"></button>
 </form>
 <div class="q-done" id="quoteOk" hidden><h3 data-i18n="q.okt"></h3><p data-i18n="q.okp"></p><a class="btn btn-primary" data-qwa target="_blank" rel="noopener" href="#" data-i18n="q.wa"></a></div>
 <div class="q-done" id="quoteFail" hidden><h3 data-i18n="q.failt"></h3><p data-i18n="q.failp"></p><a class="btn btn-primary" data-qwa target="_blank" rel="noopener" href="#" data-i18n="q.wa"></a></div>
</div>
</div></section>
</main>
<div id="site-footer"></div>
</body>
</html>
