<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YA Marketing Agency</title>
<meta name="description" content="YA Marketing Agency — وكالة تسويق رقمي: سوشيال ميديا، إعلانات، دعاية وتسويق إلكتروني.">
<link rel="icon" href="assets/img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/main.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="page-hero"><div class="container"><h1 data-i18n="con.title"></h1><p data-i18n="con.sub"></p></div></div>
<section><div class="container contact-grid">
 <div class="card"><h3 data-i18n="con.info"></h3>
  <div class="social">
   <a class="wa" data-wa target="_blank" rel="noopener" href="#">💬 <span data-i18n="con.wa"></span></a>
   <a data-link="instagram" target="_blank" rel="noopener" href="#">📸 Instagram</a>
   <a data-link="facebook" target="_blank" rel="noopener" href="#">👍 Facebook</a>
   <a data-link="tiktok" target="_blank" rel="noopener" href="#">🎵 TikTok</a>
  </div></div>
 <div class="card"><form id="contactForm">
  <label for="name" data-i18n="con.name"></label><input id="name" name="name" required>
  <label for="phone" data-i18n="con.phone"></label><input id="phone" name="phone" type="tel" required>
  <label for="service" data-i18n="con.service"></label>
  <select id="service" name="service"><option value="Social Media">Social Media</option><option value="Paid Ads">Paid Ads</option><option value="Content">Content</option><option value="Branding">Branding</option><option value="SEO">SEO</option><option value="Web">Web</option></select>
  <label for="msg" data-i18n="con.msg"></label><textarea id="msg" name="msg"></textarea>
  <button class="btn btn-primary" type="submit" data-i18n="con.send"></button>
 </form></div>
</div></section>
</main>
<div id="site-footer"></div>
</body>
</html>
